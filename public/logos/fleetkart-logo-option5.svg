<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="opt5Car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#7091E6" />
      <stop offset="100%" stop-color="#3D52A0" />
    </linearGradient>
  </defs>

  <!-- Icon: Futuristic Aerodynamic LED Lightbar Car -->
  <g transform="translate(14, 15)">
    <!-- Squircle Background -->
    <rect width="70" height="70" rx="22" fill="#0F172A" />
    
    <!-- Horizon Glow Line -->
    <line x1="12" y1="36" x2="58" y2="36" stroke="#38BDF8" stroke-width="1" opacity="0.4" />

    <!-- Connected LED DRL Lightbar -->
    <path d="M14 36 C22 36, 26 31, 35 31 C44 31, 48 36, 56 36" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Sleek Windshield & Roof Canopy -->
    <path d="M24 31 L29 20 C30 18.5 32 17.5 35 17.5 C38 17.5 40 18.5 41 20 L46 31 Z" fill="url(#opt5Car)" opacity="0.85" />
    
    <!-- Bumper & Air Intake -->
    <path d="M18 42 L25 49 C26 50 28 51 35 51 C42 51 44 50 45 49 L52 42" stroke="#7091E6" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Signature Blue Brand Dot (From Fleetkart Navbar) -->
    <circle cx="35" cy="41" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(104, 28)">
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      FLEET<tspan fill="#3D52A0">KART</tspan>
    </text>
    <g transform="translate(0, 36)">
      <circle cx="5" cy="6" r="3.5" fill="#38BDF8" />
      <text x="14" y="10" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="1">
        INDIA
      </text>
      <text x="56" y="10" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">
        | Group Auto Purchasing
      </text>
    </g>
  </g>
</svg>
