<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="opt4Ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D52A0" />
      <stop offset="50%" stop-color="#7091E6" />
      <stop offset="100%" stop-color="#1E2E4E" />
    </linearGradient>
    <linearGradient id="opt4Bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7091E6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Icon: Modern Steering Wheel Emblem with Forward Slanted F -->
  <g transform="translate(18, 14)">
    <!-- Outer Steering Wheel Ring -->
    <circle cx="36" cy="36" r="34" stroke="url(#opt4Ring)" stroke-width="5" fill="#FFFFFF" />
    <circle cx="36" cy="36" r="27" stroke="#EDE8F5" stroke-width="1.5" fill="none" />
    
    <!-- Dynamic Forward 'F' with 3 Fleet Aerodynamic Slices -->
    <!-- Top Bar -->
    <path d="M22 23 L47 23 C49 23 51 24.5 50.5 26.5 L49 32 L22 32 Z" fill="#3D52A0" />
    <!-- Middle Bar -->
    <path d="M22 36 L43 36 C44.5 36 45.8 37 45.3 38.5 L44 43 L22 43 Z" fill="url(#opt4Bar)" />
    <!-- Vertical Spine Stem -->
    <path d="M22 23 L28 23 L28 51 C28 52 27 53 26 53 L22 53 Z" fill="#1E2E4E" />
    
    <!-- Precision Hub Dot -->
    <circle cx="36" cy="36" r="3" fill="#7091E6" />
  </g>

  <!-- Typography -->
  <g transform="translate(106, 26)">
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8" fill="#1E2E4E">
      FLEET<tspan fill="#3D52A0">KART</tspan>
    </text>
    <line x1="0" y1="36" x2="260" y2="36" stroke="#ADBBDA" stroke-width="1.5" stroke-linecap="round" />
    <text x="0" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.8" fill="#7091E6">
      INDIA • GROUP CAR BUYING
    </text>
  </g>
</svg>
