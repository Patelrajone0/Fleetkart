<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="opt1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7091E6" />
      <stop offset="100%" stop-color="#3D52A0" />
    </linearGradient>
    <linearGradient id="opt1Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7091E6" />
    </linearGradient>
    <filter id="opt1Shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3D52A0" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(14, 14)" filter="url(#opt1Shadow)">
    <!-- Base Rounded Square / Shield -->
    <rect width="72" height="72" rx="20" fill="url(#opt1Grad)" />
    
    <!-- Stylized Aerodynamic F & Dual Fleet Wing Car -->
    <!-- Top Wing -->
    <path d="M18 24 C18 21.8 19.8 20 22 20 L52 20 C54.5 20 56 22.8 54.5 24.8 L46 34 L22 34 C19.8 34 18 32.2 18 30 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Middle Dynamic Car Wing (Fleet formation) -->
    <path d="M26 38 L44 38 C46 38 47.5 39.5 46.8 41.4 L43 50 L26 50 Z" fill="url(#opt1Accent)" />
    
    <!-- Bottom Speed Jet / Wheel Dot -->
    <circle cx="24" cy="44" r="4.5" fill="#FFFFFF" />
    <circle cx="45" cy="46" r="3.5" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Typography Lockup -->
  <!-- Brand Name -->
  <text x="104" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#3D52A0">
    FLEET<tspan fill="#7091E6">KART</tspan>
  </text>

  <!-- Country Tag & Subtitle -->
  <g transform="translate(105, 63)">
    <rect x="0" y="0" width="46" height="18" rx="6" fill="#EDE8F5" stroke="#ADBBDA" stroke-width="1" />
    <text x="23" y="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1.5" fill="#3D52A0" text-anchor="middle">
      INDIA
    </text>
    
    <text x="56" y="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8697C4" letter-spacing="0.5">
      India's Group Car Buying Network
    </text>
  </g>
</svg>
